<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening board</title>
<script>
  // GitHub Pages has no server routing. Send /name and /l/name to the app, which reads the path from ?p=.
  (function () {
    var parts = location.pathname.split("/");
    var base = /github\.io$/.test(location.hostname) ? "/" + parts[1] + "/" : "/";
    var rest = location.pathname.slice(base.length);
    location.replace(base + "?p=/" + rest);
  })();
</script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0B0D;color:#8A909C;font:500 12px/1.6 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;">
  <p style="margin:0;">Coverage Ops &middot; opening&hellip;</p>
</body>
</html>
